name: Web build on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one, but never cancels one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:jvmTest

      # Production wasmJs bundle. Every path in it is relative, so it works from the
      # /wristbeat/ project-site subpath without extra config.
      - name: Build web bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      # webrender.net sits behind Cloudflare, which caches .js for hours. composeApp.js has
      # the same name every build (the .wasm files it loads are content-hashed), so a stale
      # copy keeps loading the previous build. Version its URL per commit to bust the cache.
      - name: Cache-bust composeApp.js
        run: sed -i "s|src=\"composeApp.js\"|src=\"composeApp.js?v=${GITHUB_SHA::8}\"|" composeApp/build/dist/wasmJs/productionExecutable/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
