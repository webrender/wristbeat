name: Android & Wear OS APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:jvmTest

      - name: Build debug APKs
        run: ./gradlew :androidApp:assembleDebug :wearApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wristbeat-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wristbeat-wear-debug
          path: wearApp/build/outputs/apk/debug/*.apk
