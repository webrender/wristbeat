name: Android & Wear OS APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:jvmTest

      - name: Install stable signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "WRISTBEAT_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; APKs use a throwaway key and won't install over earlier releases."
          fi

      - name: Build debug APKs
        run: ./gradlew :androidApp:assembleDebug :wearApp:assembleDebug

      - name: Name APKs
        run: |
          mkdir dist
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk dist/wristbeat-android.apk
          cp wearApp/build/outputs/apk/debug/wearApp-debug.apk dist/wristbeat-wear.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wristbeat-android-debug
          path: dist/wristbeat-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wristbeat-wear-debug
          path: dist/wristbeat-wear.apk

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          {
            echo "Debug build of \`$short_sha\` on main."
            echo
            echo '```'
            git log -1 --format=%B
            echo '```'
          } > notes.md
          gh release create "build-$GITHUB_RUN_NUMBER" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Build $GITHUB_RUN_NUMBER ($short_sha)" \
            --notes-file notes.md \
            --latest
